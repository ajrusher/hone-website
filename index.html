<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hone — Hone In. Daily.</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --dk:     #0E1E0A;
    --cream:  #F5FAF2;
    --lime:   #78C840;

    /* Zoom knobs — raise to push further into each photo */
    --left-zoom:  1.00;
    --right-zoom: 1.18;
  }

  html, body { height: 100%; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--dk);
    color: var(--cream);
    overflow-x: hidden;
  }

  .hero {
    position: relative;
    height: 100vh;
    min-height: 620px;
    overflow: hidden;
  }

  /* ─── PANELS ─── */
  .panels {
    position: absolute; inset: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .panel { position: relative; overflow: hidden; background: var(--dk); }
  .panel img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .panel-left img {
    object-position: center 42%;
    transform: scale(var(--left-zoom));
  }
  .panel-right img {
    object-position: center center;
    transform: scale(var(--right-zoom));
  }

  /* ─── FADES ───
     Centre band carries the lockup. Top and bottom edges of both
     photographs stay clean. */
  .centre-fade {
    position: absolute; inset: 0;
    z-index: 2; pointer-events: none;
    background: linear-gradient(180deg,
      rgba(14,30,10,0)    0%,
      rgba(14,30,10,0.20) 16%,
      rgba(14,30,10,0.60) 34%,
      rgba(14,30,10,0.64) 50%,
      rgba(14,30,10,0.60) 66%,
      rgba(14,30,10,0.20) 84%,
      rgba(14,30,10,0)    100%);
  }
  .bottom-fade {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 16%;
    z-index: 3; pointer-events: none;
    background: linear-gradient(180deg,
      rgba(14,30,10,0) 0%,
      rgba(14,30,10,0.58) 100%);
  }

  /* ─── CENTRED LOCKUP ─── */
  .content {
    position: absolute; inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 32px 90px;
  }

  .logo {
    font-size: clamp(32px, 3.4vw, 46px);
    font-weight: 600;
    letter-spacing: -0.05em;
    color: var(--cream);
    line-height: 1;
    padding-right: 0.05em;
    margin-bottom: 26px;
  }
  .logo .dot { color: var(--lime); }

  h1 {
    font-size: clamp(36px, 4.8vw, 68px);
    font-weight: 600;
    letter-spacing: -0.045em;
    line-height: 1.05;
    color: var(--cream);
    margin-bottom: 20px;
  }
  h1 em { font-style: normal; color: var(--lime); }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--cream);
    margin-bottom: 38px;
  }
  .eyebrow::before, .eyebrow::after {
    content: ''; width: 26px; height: 1px;
    background: var(--cream); opacity: 0.45;
  }

  .signup-label {
    font-size: 14px; font-weight: 400;
    color: var(--lime);
    letter-spacing: 0.02em;
    margin-bottom: 14px;
  }

  /* ─── EMAIL FIELD ─── */
  .signup { width: 100%; max-width: 380px; }
  .signup-row {
    background: rgba(14,30,10,0.55);
    border: 1px solid rgba(245,250,242,0.28);
    border-radius: 10px;
    padding: 5px;
    transition: border-color 0.18s ease;
  }
  .signup-row:focus-within { border-color: var(--lime); }
  .signup-input {
    width: 100%;
    background: transparent; border: none; outline: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 400;
    color: var(--cream);
    padding: 13px 16px;
    text-align: center;
    letter-spacing: -0.01em;
  }
  .signup-input::placeholder { color: rgba(245,250,242,0.55); }
  .signup-msg {
    font-size: 13px;
    margin-top: 13px;
    min-height: 18px;
    letter-spacing: -0.01em;
  }
  .signup-msg.error   { color: #FF9A99; }
  .signup-msg.success { color: var(--lime); }

  /* ─── FOOTER ─── */
  .foot {
    position: absolute;
    bottom: 28px; left: 0; right: 0;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: rgba(245,250,242,0.78);
  }
  .foot .item {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    line-height: 1;
  }
  .foot .item svg { display: block; flex-shrink: 0; }
  .foot .ig { width: 14px; height: 14px; }
  .foot .tt { width: 12.5px; height: 12.5px; }
  .foot .sep {
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--lime);
    opacity: 0.65;
    flex-shrink: 0;
  }

  /* ─── MOBILE ─── */
  @media (max-width: 760px) {
    .panels { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .content { padding: 32px 22px 96px; }
    .centre-fade {
      background: linear-gradient(180deg,
        rgba(14,30,10,0)    0%,
        rgba(14,30,10,0.26) 14%,
        rgba(14,30,10,0.66) 32%,
        rgba(14,30,10,0.70) 50%,
        rgba(14,30,10,0.66) 68%,
        rgba(14,30,10,0.26) 86%,
        rgba(14,30,10,0)    100%);
    }
    .foot { gap: 12px; font-size: 10px; flex-wrap: wrap; padding: 0 20px; }
    .foot .ig { width: 13px; height: 13px; }
    .foot .tt { width: 11.5px; height: 11.5px; }
  }
</style>
</head>

<script>
(function () {
  var form  = document.getElementById('signupForm');
  var input = document.getElementById('emailInput');
  var msg   = document.getElementById('signupMsg');

  function valid(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var email = input.value.trim();

    if (!email) {
      msg.textContent = 'Please enter your email address.';
      msg.className = 'signup-msg error';
      input.focus();
      return;
    }
    if (!valid(email)) {
      msg.textContent = 'Please enter a valid email address.';
      msg.className = 'signup-msg error';
      input.focus();
      return;
    }

    // TODO: wire to your email provider (Formspree / Mailchimp / ConvertKit).
    msg.textContent = 'Thanks \u2014 we\u2019ll be in touch soon.';
    msg.className = 'signup-msg success';
    form.reset();
  });

  input.addEventListener('input', function () {
    if (msg.textContent) { msg.textContent = ''; msg.className = 'signup-msg'; }
  });
})();
</script>
